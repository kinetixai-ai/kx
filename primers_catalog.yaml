# KinetixAI Primer catalog — the 24 primers still showing "Coming soon"
# on https://kinetixai.ai/primers/.
#
# Run:  python3 scripts/ship_primers.py
#
# slug and category are COPIED FROM the website's app/content.py PRIMERS
# items, not invented here. scripts/add_primer.py in the website repo
# validates the category against PRIMERS["categories"] and the slug against
# the coming-soon list, so a mismatch here fails at upload time, after the
# tokens have been spent.

defaults:
  pages: 8
  pdfs: 1
  ppts: 1
  images: 8
  jsons: 1
  watermark: "Rohit Patel | Narmadya Innovations"
  author: "Rohit Patel"
  engine: groq
  # No model pinned: Groq rotates ids and blocks models per project, so any
  # pin eventually 403s or 404s. Check with: kx primers models groq --verify
  mode: iterative
  min_sections: 5
  verify_citations: true
  research_limit: 8
  personas: [student, professional]
  out_dir: ./dist/primers
  copy_to: "/Users/rohitpatel/My_Companies_Data/KinetixAI-AI/kx-cli/notes/"

